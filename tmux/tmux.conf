# General settings
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:usstyle:extkeys"
set -g extended-keys on
set -g set-clipboard on

# Allow use of mouse to focus windows, select and copy text.
set-option -g mouse on

# Let apps send escape sequences (images, notifications) to the outer terminal
set -g allow-passthrough on

# Change prefix key to CTRL + A
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Other key bindings to start new splits and windows in current wd
bind - split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}" 
bind c new-window -c "#{pane_current_path}"

# Use Shift + Alt + direction to change panes (without prefix key)
# Alt + Left/Right stays free for word movement in the shell and editors
bind -n S-M-Left select-pane -L
bind -n S-M-Right select-pane -R
bind -n S-M-Up select-pane -U
bind -n S-M-Down select-pane -D

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-yank'

# Set default theme
set -g @themepack 'powerline/block/cyan'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
