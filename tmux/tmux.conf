# General settings
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:usstyle:extkeys"
set -g extended-keys on
set -g set-clipboard on

# Allow use of mouse to focus windows, select and copy text.
set-option -g mouse on

# Let apps send escape sequences (kitty graphics, notifications) to the outer
# terminal, so a TUI can show images (cardsmith portraits). tmux strips them
# otherwise. "on" passes only for the visible pane; "all" would also let hidden
# panes draw over whatever is on screen.
set -g allow-passthrough on

# Pin the pane shell. tmux resolves default-shell once, from the environment of
# whichever client starts the server ($SHELL, else the passwd shell), and freezes
# it for the server's lifetime. A client launched with SHELL=/bin/sh (container
# shell, cron, `SHELL=/bin/sh cmd` prefix) therefore gives every pane dash until
# the server dies. Pinning it makes the server immune to its launch environment.
# zsh lives in /usr/bin on Debian and /bin on macOS.
if-shell 'test -x /usr/bin/zsh' 'set -g default-shell /usr/bin/zsh' 'set -g default-shell /bin/zsh'

# Change prefix key to CTRL + A
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Other key bindings to start new splits and windows in current wd
bind - split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Use Shift + Alt + direction to change panes (without prefix key)
# Alt + Left/Right stays free for word movement in the shell and editors
bind -n S-M-Left select-pane -L
bind -n S-M-Right select-pane -R
bind -n S-M-Up select-pane -U
bind -n S-M-Down select-pane -D

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-yank'

# Set default theme
set -g @themepack 'powerline/block/cyan'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# On the Debian box ~/.tmux/plugins/tpm is tpack, a TPM drop-in. Its self-update
# renames the downloaded binary into place, and /tmp is a separate mount there,
# so the rename fails with EXDEV (which tpack misreports as a permission error).
# Pointing TMPDIR at the same filesystem fixes it and is harmless elsewhere.
run 'mkdir -p "$HOME/.cache/tpack"; TMPDIR="$HOME/.cache/tpack" ~/.tmux/plugins/tpm/tpm'
